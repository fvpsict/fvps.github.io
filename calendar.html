<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Calendar - FVPS ICT Microsite</title>
<link rel="stylesheet" href="styles.css">
<style>
/* Navbar adjustments for toggle + brand */
.navbar {
    position: fixed;
    top:0; left:0;
    width:100%; height:60px;
    background:#004080;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding:0 15px;
    z-index:1000;
    color:white;
}

.toggle {
    font-size:28px;
    cursor:pointer;
    user-select:none;
    margin-right:15px;
}

.brand {
    font-size:1.5rem;
    font-weight:bold;
    color:white;
    text-decoration:none;
}

.menu {
    position: fixed;
    top:0; left:-250px;
    width:250px; height:100%;
    background:#003366;
    flex-direction: column;
    padding-top:60px;
    transition:left 0.3s ease;
    z-index:999;
    display:flex;
}

.menu a {
    padding:15px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.2);
}

.menu a:hover { background:#0055aa; }
.menu.active { left:0; }

.overlay {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5);
    display:none;
    z-index:900;
}

.overlay.active { display:block; }

/* Make iframe responsive */
iframe {
    width:100%;
    max-width:1200px;
    height:600px;
    border:1px solid #777;
}
main { padding-top:80px; text-align:center; }
</style>
</head>
<body>

<header class="navbar">
    <div class="toggle" onclick="toggleMenu()">☰</div>
    <a href="index.html" class="brand">FVPS ICT</a>
    <nav class="menu">
        <a href="index.html">Home</a>
        <a href="ictrequest.html">ICT Request</a>
        <a href="calendar.html" class="active">Booking Calendar</a>
        <a href="mims.html">Student iCON</a>
        <a href="sls.html">SLS</a>
        <a href="venue.html">Venue Booking</a>
        <a href="ictfault.html">ICT Fault</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="overlay" onclick="closeMenu()"></div>

<main>
    <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Asia%2FSingapore&showPrint=0&mode=AGENDA&src=ZjQyZDgxNDg0MWYxMTI4M2E1ZmEzY2Y0Mjc2ZWY1OWRlMTFkYWRhNTU0NTVjZTdjMTUxNzY1ODFkM2ZjNzc2YkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%23039be5" scrolling="no"></iframe>
</main>

<script>
function toggleMenu() {
    document.querySelector('.menu').classList.toggle('active');
    document.querySelector('.overlay').classList.toggle('active');
}
function closeMenu() {
    document.querySelector('.menu').classList.remove('active');
    document.querySelector('.overlay').classList.remove('active');
}
</script>

</body>
</html>
