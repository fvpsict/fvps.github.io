<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - FVPS ICT Microsite</title>
<link rel="stylesheet" href="styles.css">
<style>
/* Navbar */
.navbar {
    position: fixed;
    top:0; left:0;
    width:100%; height:60px;
    background:#004080;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding:0 15px;
    z-index:1000;
    color:white;
}

.toggle {
    font-size:28px;
    cursor:pointer;
    user-select:none;
    margin-right:15px;
}

.brand {
    font-size:1.5rem;
    font-weight:bold;
    color:white;
    text-decoration:none;
}

.menu {
    position: fixed;
    top:0; left:-80%;
    width:80%;
    max-width:250px;
    height:100%;
    background:#003366;
    flex-direction: column;
    padding-top:60px;
    transition: left 0.3s ease;
    z-index:999;
    display:flex;
}

.menu a {
    padding:15px;
    color:white;
    text-decoration:none;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

.menu a:hover, .menu a.active {
    background:#0055aa;
}

.menu.active { left:0; }

.overlay {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5);
    display:none;
    z-index:900;
}

.overlay.active { display:block; }

main {
    padding-top:80px;
    text-align:center;
    font-family: Arial, sans-serif;
}

main h1 {
    margin-bottom:20px;
}

main p {
    font-size:1.1rem;
    margin-bottom:20px;
}

main a img {
    width:120px;
    height:120px;
    transition: transform 0.2s ease;
}

main a img:hover {
    transform: scale(1.1);
}

.contact-number a {
    color:#004080;
    font-weight:bold;
    text-decoration:none;
}

.contact-number a:hover {
    text-decoration:underline;
}
</style>
</head>
<body>

<header class="navbar">
    <div class="toggle" onclick="toggleMenu()" aria-label="Open menu" aria-expanded="false">☰</div>
    <a href="index.html" class="brand">FVPS ICT</a>
    <nav class="menu" aria-hidden="true"> 
        <a href="index.html">Home</a>
        <a href="ictrequest.html">ICT Request</a>
        <a href="calendar.html">Booking Calendar</a>
        <a href="mims.html">Student iCON</a>
        <a href="sls.html">SLS</a>
        <a href="venue.html">Venue Booking</a>
        <a href="ictfault.html">ICT Fault</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
</header>

<div class="overlay" onclick="closeMenu()"></div>

<main>
    <h1>Contact Us</h1>
    <p>Click the icon below to WhatsApp the ICT Team or reach us directly at:</p>
    <div class="contact-number">
        <a href="tel:+6591394595">+65 9139 4595</a>
    </div>
    <a href="https://wa.me/6591394595" target="_blank" rel="noopener noreferrer">
        <img src="Images/whatsapp.png" alt="WhatsApp Icon">
    </a>
</main>

<script>
function toggleMenu() {
    const menu = document.querySelector('.menu');
    const overlay = document.querySelector('.overlay');
    const toggle = document.querySelector('.toggle');
    menu.classList.toggle('active');
    overlay.classList.toggle('active');
    toggle.setAttribute('aria-expanded', menu.classList.contains('active'));
    menu.setAttribute('aria-hidden', !menu.classList.contains('active'));
}

function closeMenu() {
    const menu = document.querySelector('.menu');
    const overlay = document.querySelector('.overlay');
    const toggle = document.querySelector('.toggle');
    menu.classList.remove('active');
    overlay.classList.remove('active');
    toggle.setAttribute('aria-expanded', false);
    menu.setAttribute('aria-hidden', true);
}
</script>

</body>
</html>
