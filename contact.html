<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - FVPS ICT Microsite</title>
<link rel="stylesheet" href="styles.css">

<style>
  main {
    text-align: center;
    padding: 100px 20px 40px 20px;
  }

  .contact-number {
    margin: 15px 0;
    font-size: 1.2rem;
    font-weight: bold;
  }

  /* ✅ Reduce WhatsApp icon size */
  main img {
    width: 100px;         /* desktop size */
    height: auto;
    margin-top: 10px;
    transition: transform 0.2s ease;
  }

  main img:hover {
    transform: scale(1.05);
  }

  /* ✅ Smaller size on mobile */
  @media (max-width: 600px) {
    main img {
      width: 70px;
    }
  }
</style>
</head>

<body>

<header class="navbar">
    <div class="toggle" onclick="toggleMenu()" aria-label="Open menu" aria-expanded="false">☰</div>
    <a href="index.html" class="brand">FVPS ICT</a>
    <nav class="menu" aria-hidden="true"> 
        <a href="index.html">Home</a>
        <a href="ictrequest.html">ICT Request</a>
        <a href="calendar.html">Booking Calendar</a>
        <a href="mims.html">Student iCON</a>
        <a href="sls.html">SLS</a>
        <a href="venue.html">Venue Booking</a>
        <a href="ictfault.html">ICT Fault Report</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
</header>

<div class="overlay" onclick="closeMenu()"></div>

<main>
    <h1>Contact Us</h1>
    <p>Click the icon below to WhatsApp the ICT Team or reach us directly at:</p>
    <div class="contact-number">
        <a href="tel:+6591394595">91394595</a>
    </div>
    <a href="https://wa.me/6591394595" target="_blank" rel="noopener noreferrer">
        <img src="Images/whatsapp.png" alt="WhatsApp Icon">
    </a>
</main>

<script>
function toggleMenu() {
    const menu = document.querySelector('.menu');
    const overlay = document.querySelector('.overlay');
    const toggle = document.querySelector('.toggle');
    menu.classList.toggle('active');
    overlay.classList.toggle('active');
    toggle.setAttribute('aria-expanded', menu.classList.contains('active'));
    menu.setAttribute('aria-hidden', !menu.classList.contains('active'));
}

function closeMenu() {
    const menu = document.querySelector('.menu');
    const overlay = document.querySelector('.overlay');
    const toggle = document.querySelector('.toggle');
    menu.classList.remove('active');
    overlay.classList.remove('active');
    toggle.setAttribute('aria-expanded', false);
    menu.setAttribute('aria-hidden', true);
}
</script>

</body>
</html>
