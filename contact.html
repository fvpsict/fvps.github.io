<body>

<header class="navbar">
    <div class="toggle" onclick="toggleMenu()" aria-label="Open menu" aria-expanded="false">☰</div>
    <a href="index.html" class="brand">FVPS ICT</a>
    <nav class="menu" aria-hidden="true"> 
        <a href="index.html">Home</a>
        <a href="ictrequest.html">ICT Request</a>

        <a href="ictfault.html">ICT Fault</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
</header>

<div class="overlay" onclick="closeMenu()"></div>

<main>
    <h1>Contact Us</h1>
    <p>Click the icon below to WhatsApp the ICT Team or reach us directly at:</p>
    <div class="contact-number">
        <a href="tel:+6591394595">+65 9139 4595</a>
    </div>
    <a href="https://wa.me/6591394595" target="_blank" rel="noopener noreferrer">
        <img src="Images/whatsapp.png" alt="WhatsApp Icon">
    </a>
</main>

<script>
function toggleMenu() {
    const menu = document.querySelector('.menu');
    const overlay = document.querySelector('.overlay');
    const toggle = document.querySelector('.toggle');
    menu.classList.toggle('active');
    overlay.classList.toggle('active');
    toggle.setAttribute('aria-expanded', menu.classList.contains('active'));
    menu.setAttribute('aria-hidden', !menu.classList.contains('active'));
}

function closeMenu() {
    const menu = document.querySelector('.menu');
    const overlay = document.querySelector('.overlay');
    const toggle = document.querySelector('.toggle');
    menu.classList.remove('active');
    overlay.classList.remove('active');
    toggle.setAttribute('aria-expanded', false);
    menu.setAttribute('aria-hidden', true);
}
</script>

</body>
</html>
